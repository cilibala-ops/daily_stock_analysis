name: 自动同步上游

on:
  schedule:
    # UTC 01:15 = 北京时间 09:15，每天检查一次。
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.repository.fork && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 合并上游更新
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub 原生同步接口保留本分支提交；冲突时返回非零并停止。
          # 不检出或执行上游代码；专用同步令牌可授权上游 workflow 文件更新。
          # 未配置专用令牌时使用 GITHUB_TOKEN，workflow 更新可能因权限不足而停止。
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f "branch=${TARGET_BRANCH}" \
            --jq '.message' | tee -a "$GITHUB_STEP_SUMMARY"
